# =============================================================================
# Balboa Spa (Robust) — sample dashboard  (v0.3.0)
# =============================================================================
#
# Three views:
#   1. Spa       — daily use: thermostat, pumps, lights, live status, fault alert
#   2. Setup     — filter cycles, heat mode, temperature range, aux/mister
#   3. Health    — connection diagnostics, spa diagnostics, history, sync clock
#
# How to use:
#   1. Settings → Dashboards → Add Dashboard → New dashboard from scratch
#   2. Open it → pencil (Edit) → three-dot menu → Raw configuration editor
#   3. Paste this file
#   4. Search-and-replace `YOUR_SPA` with your entity slug. Find your slug in
#      Developer Tools → States (filter by "balboa"). Example: entity
#      `climate.garden_spa` ⇒ slug is `garden_spa`.
#   5. Save. Done.
#
# Notes:
#   • Uses only stock HA cards — no HACS card dependencies (Mushroom, custom
#     button-card, etc.). If you add those later, this stays as the baseline.
#   • Optional entities (aux, mister, blower, filter durations) are commented
#     "OPTIONAL — delete if your module doesn't expose it" so beginners aren't
#     confused by "unavailable" tiles. Advanced users can wrap them in a
#     `type: conditional` card if they'd rather auto-hide.
#   • The fault alert on view 1 is a `type: conditional` — it only appears
#     when a fault is recent. Zero visual weight until it matters.
#   • Diagnostic split into spa-native (spa_time / wifi_state / clock_offset)
#     ABOVE our integration items (uptime, backoff, etc.) per the plan's
#     section-ordering rule. HA's device page can't enforce this; this
#     dashboard can.
# =============================================================================

title: Spa
views:
  # ==========================================================================
  # VIEW 1: SPA  (daily-use surface)
  # ==========================================================================
  - title: Spa
    path: spa
    icon: mdi:hot-tub
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      # --- Hero: climate + at-a-glance status ------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hot tub
            heading_style: title
            icon: mdi:hot-tub
          - type: thermostat
            entity: climate.YOUR_SPA
            features:
              - type: climate-hvac-modes
          - type: tile
            entity: binary_sensor.YOUR_SPA_reachable
            color: green
            icon: mdi:lan-connect
            vertical: true
            state_content:
              - state
              - last-changed
          - type: tile
            entity: sensor.YOUR_SPA_spa_state
            name: Spa state
            vertical: true
          - type: tile
            entity: sensor.YOUR_SPA_heat_state
            name: Heat state
            vertical: true

      # --- Pumps + lights (daily-use only) ---------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Pumps & light
            heading_style: title
            icon: mdi:pump
          - type: tile
            entity: switch.YOUR_SPA_all_pumps
            name: All pumps
            color: primary
            icon: mdi:pump
          - type: tile
            entity: fan.YOUR_SPA_pump_1
            features:
              - type: fan-preset-modes
                style: dropdown
          - type: tile
            entity: fan.YOUR_SPA_pump_2
            features:
              - type: fan-preset-modes
                style: dropdown
          - type: tile
            entity: fan.YOUR_SPA_pump_3
            features:
              - type: fan-preset-modes
                style: dropdown
          # OPTIONAL — blower; delete if your spa doesn't have one
          - type: tile
            entity: fan.YOUR_SPA_blower_1
            features:
              - type: fan-preset-modes
                style: dropdown
          - type: tile
            entity: light.YOUR_SPA_light_1
            features:
              - type: light-brightness

      # --- Filter-cycle status (read-only here; set schedule on Setup) -----
      - type: grid
        cards:
          - type: heading
            heading: Filter cycles
            heading_style: title
            icon: mdi:filter
          - type: tile
            entity: binary_sensor.YOUR_SPA_filter_cycle_1_running
            name: Cycle 1
            vertical: true
          - type: tile
            entity: binary_sensor.YOUR_SPA_filter_cycle_2_running
            name: Cycle 2
            vertical: true
          - type: tile
            entity: binary_sensor.YOUR_SPA_circulation_pump_running
            name: Circulation
            vertical: true

      # --- Last spa error (only renders when a fault is recorded) ---------
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: event.YOUR_SPA_fault
                state_not: unavailable
              - condition: state
                entity: event.YOUR_SPA_fault
                state_not: unknown
            card:
              type: markdown
              content: >
                ### Last Spa Error

                **When:** {{
                as_timestamp(states.event.YOUR_SPA_fault.state) |
                timestamp_custom('%b %d %H:%M') }}
                &nbsp; · &nbsp; **Type:** `{{
                state_attr('event.YOUR_SPA_fault', 'event_type') }}`

                See the **Health** view for the full fault log.

  # ==========================================================================
  # VIEW 2: SETUP  (schedules + modes + optional accessories)
  # ==========================================================================
  - title: Setup
    path: setup
    icon: mdi:cog
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      # --- Heat & temperature range ----------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Heat
            heading_style: title
            icon: mdi:thermostat
          - type: tile
            entity: select.YOUR_SPA_heat_mode
            name: Heat mode
            icon: mdi:thermostat
            features:
              - type: select-options
          - type: tile
            entity: select.YOUR_SPA_temperature_range
            name: Temperature range
            icon: mdi:thermometer-lines
            features:
              - type: select-options
          - type: tile
            entity: sensor.YOUR_SPA_line_voltage
            name: Line voltage

      # --- Filter cycle 1 --------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Filter cycle 1
            heading_style: title
            icon: mdi:filter
          - type: tile
            entity: binary_sensor.YOUR_SPA_filter_cycle_1_running
            name: Running
          - type: tile
            entity: time.YOUR_SPA_filter_cycle_1_start
            name: Start
          - type: tile
            entity: time.YOUR_SPA_filter_cycle_1_end
            name: End
          # OPTIONAL — only present when duration >0 min
          - type: tile
            entity: sensor.YOUR_SPA_filter_1_duration
            name: Duration

      # --- Filter cycle 2 --------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Filter cycle 2
            heading_style: title
            icon: mdi:filter-outline
          - type: tile
            entity: switch.YOUR_SPA_filter_cycle_2_enabled
            name: Enabled
          - type: tile
            entity: binary_sensor.YOUR_SPA_filter_cycle_2_running
            name: Running
          - type: tile
            entity: time.YOUR_SPA_filter_cycle_2_start
            name: Start
          - type: tile
            entity: time.YOUR_SPA_filter_cycle_2_end
            name: End
          # OPTIONAL — only present when duration >0 min
          - type: tile
            entity: sensor.YOUR_SPA_filter_2_duration
            name: Duration

      # --- Optional accessories --------------------------------------------
      # OPTIONAL — the whole section; delete if your module has no aux/mister.
      - type: grid
        cards:
          - type: heading
            heading: Aux & mister
            heading_style: title
            icon: mdi:toggle-switch-variant
          - type: tile
            entity: switch.YOUR_SPA_aux_1
            name: Aux 1
          - type: tile
            entity: switch.YOUR_SPA_aux_2
            name: Aux 2
          - type: tile
            entity: switch.YOUR_SPA_mister_1
            name: Mister 1

  # ==========================================================================
  # VIEW 3: HEALTH  (diagnostics + history + admin actions)
  # ==========================================================================
  - title: Health
    path: health
    icon: mdi:heart-pulse
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      # --- Uptime hero: gauge + rolling% + current state ------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Connection health
            heading_style: title
            icon: mdi:chart-timeline-variant
          - type: gauge
            entity: sensor.YOUR_SPA_uptime_rolling
            name: Uptime (rolling %)
            min: 0
            max: 100
            severity:
              green: 90
              yellow: 60
              red: 0
            needle: true
          - type: tile
            entity: sensor.YOUR_SPA_connection_state
            vertical: true
          - type: tile
            entity: sensor.YOUR_SPA_connect_latency
            vertical: true
          - type: tile
            entity: sensor.YOUR_SPA_current_uptime
            name: Current uptime
            vertical: true
          - type: tile
            entity: sensor.YOUR_SPA_current_downtime
            name: Current downtime
            vertical: true
          - type: tile
            entity: sensor.YOUR_SPA_current_backoff_delay
            name: Current backoff
            vertical: true
          - type: tile
            entity: sensor.YOUR_SPA_next_connection_attempt
            name: Next attempt
            vertical: true

      # --- Cumulative connect counters -------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Counters (since restart)
            heading_style: title
            icon: mdi:counter
          - type: tile
            entity: sensor.YOUR_SPA_successful_connects
            name: Connects OK
            color: green
          - type: tile
            entity: sensor.YOUR_SPA_failed_connects
            name: Connects failed
            color: red
          - type: tile
            entity: sensor.YOUR_SPA_connections_lost
            name: Connections lost
            color: red

      # --- Spa-native diagnostics ------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Spa diagnostics
            heading_style: title
            icon: mdi:hot-tub
          - type: tile
            entity: sensor.YOUR_SPA_spa_time
            name: Spa time
            icon: mdi:clock-outline
          - type: tile
            entity: sensor.YOUR_SPA_clock_offset
            name: Clock offset
            icon: mdi:clock-alert-outline
          # Tap this tile to push HA's wall time to the spa. The tile shows
          # current drift so it doubles as a "how far off am I" gauge.
          - type: tile
            entity: sensor.YOUR_SPA_clock_offset
            name: Sync spa clock (tap)
            icon: mdi:clock-check-outline
            color: primary
            tap_action:
              action: perform-action
              perform_action: balboa_robust.sync_spa_clock
            hold_action:
              action: more-info
          # OPTIONAL — only present when the module reports it
          - type: tile
            entity: sensor.YOUR_SPA_wifi_state
            name: Wi-Fi state
            icon: mdi:wifi

      # --- Admin actions ---------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Admin
            heading_style: title
            icon: mdi:tools
          - type: tile
            entity: switch.YOUR_SPA_pause_connection
            name: Pause connection
            color: orange
          - type: tile
            entity: sensor.YOUR_SPA_clock_offset
            name: Sync spa clock (HA → spa)
            icon: mdi:clock-check-outline
            color: primary
            tap_action:
              action: perform-action
              perform_action: balboa_robust.sync_spa_clock

      # --- Live history ----------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Live history (24 h)
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            entities:
              - sensor.YOUR_SPA_connection_state
              - binary_sensor.YOUR_SPA_reachable
              - sensor.YOUR_SPA_wifi_state
            hours_to_show: 24

      # --- Long-term stats -------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Long-term statistics (7 d)
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            title: Rolling uptime %
            chart_type: line
            period: hour
            days_to_show: 7
            stat_types:
              - mean
              - min
              - max
            entities:
              - sensor.YOUR_SPA_uptime_rolling
          - type: statistics-graph
            title: Connect latency (ms)
            chart_type: line
            period: hour
            days_to_show: 7
            stat_types:
              - mean
              - max
            entities:
              - sensor.YOUR_SPA_connect_latency

      # --- Fault log -------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Fault log
            heading_style: title
            icon: mdi:alert-circle-outline
          - type: tile
            entity: event.YOUR_SPA_fault
          - type: logbook
            entities:
              - event.YOUR_SPA_fault
            hours_to_show: 168 # 1 week
